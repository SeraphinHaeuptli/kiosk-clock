# Builds the two things a release needs: an .aab for Google Play, and an .apk
# for sideloading onto a phone. Run it from the Actions tab ("Run workflow"),
# or push a v* tag to also attach the APK to a GitHub release.
#
# No Expo account, no Android Studio and no local JDK are needed: GitHub's
# runners already carry the Android SDK.
#
# ---------------------------------------------------------------------------
# Signing
#
# Without secrets configured, the release build is signed with the debug
# keystore. That produces an APK you can install on your own phone and a
# bundle Play will refuse — the debug key is a key everybody already has.
#
# To sign properly, generate an upload key ON YOUR OWN MACHINE (never in CI,
# never in this repo) and keep the file somewhere you will not lose it:
#
#   keytool -genkeypair -v -keystore kiosk-upload.jks \
#     -alias kiosk-upload -keyalg RSA -keysize 4096 -validity 10000
#
#   base64 -w0 kiosk-upload.jks > kiosk-upload.jks.b64   # macOS: base64 -i
#
# Then add four repository secrets under Settings -> Secrets and variables ->
# Actions:
#
#   ANDROID_KEYSTORE_BASE64   the contents of kiosk-upload.jks.b64
#   ANDROID_KEYSTORE_PASSWORD the store password you chose
#   ANDROID_KEY_ALIAS         kiosk-upload
#   ANDROID_KEY_PASSWORD      the key password you chose
#
# Back the .jks up offline. With Play App Signing a lost upload key can be
# reset by asking Google, but that costs days you will not want to spend.
# ---------------------------------------------------------------------------

name: Android

on:
  workflow_dispatch:
    inputs:
      store:
        description: 'Which build to make'
        type: choice
        default: none
        options:
          - none
          - play
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Cheap gates before the expensive one. A native package that drifts from
      # the SDK's pins fails as a C++ error minutes into the Gradle build, and a
      # type error fails even later; both cost about a second here.
      - name: Check native dependency versions
        run: npm run check:native

      - name: Typecheck
        run: npm run typecheck

      # Cheap, and guards the quietest failure this project has: if the key
      # format in the app and the one in server/ ever drift, every key sold is
      # rejected by the app and nothing else notices.
      - name: Check the key format still round-trips
        run: npm run test:mint

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # packages, rather than the action's default of 'tools platform-tools'.
      # 'tools' is the long-deprecated SDK Tools bundle, and it drags in the
      # emulator: several hundred megabytes this job has no use for, since it
      # builds an APK and never boots one. It is also what broke run #24 —
      # sdkmanager got something that was not a valid zip ("Error on ZipFile
      # unknown archive") and the job died before Gradle started. Dropping it
      # removes the download and the failure mode together; the runner image
      # already ships the platforms and build-tools that AGP needs.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      # Which app this run builds. A tag push is a sideload release, and a
      # sideloaded APK cannot use Play Billing at all — purchases only work for
      # apps Play itself installed — so tags default to the storeless build
      # rather than shipping a purchase button that always fails.
      #
      # 'play' is for the bundle that goes to a Play track, and has to be asked
      # for explicitly from the Actions tab.
      - name: Choose the build variant
        id: variant
        run: |
          store="${{ inputs.store || 'none' }}"
          echo "store=$store" >> "$GITHUB_OUTPUT"
          if [ "$store" = none ]; then
            node scripts/prepare-storeless.mjs
          fi
          echo "::notice title=Build variant::$store"

      - name: Decode the upload key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Unsigned release::No upload key configured. \
          The release build will be signed with the public debug key: fine for \
          sideloading, rejected by Play. See the header of this workflow."
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          # Prove it decoded to a real keystore before spending ten minutes on
          # a build that would fail at the signing step.
          keytool -list -keystore "$RUNNER_TEMP/upload.jks" \
            -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" > /dev/null
          echo "present=true" >> "$GITHUB_OUTPUT"

      # android/ is generated rather than committed, so it can never drift from
      # app.json. The version code comes from the run number: Play refuses any
      # upload that does not raise it, and a number kept in the repo is a number
      # somebody eventually forgets to raise.
      - name: Generate the native project
        env:
          KIOSK_VERSION_CODE: ${{ github.run_number }}
          EXPO_PUBLIC_KIOSK_STORE: ${{ steps.variant.outputs.store }}
        run: npx expo prebuild --platform android --no-install

      # Passed as ORG_GRADLE_PROJECT_* environment variables rather than -P
      # arguments, so the passwords never appear in a command line.
      - name: Build the bundle and the APK
        working-directory: android
        env:
          EXPO_PUBLIC_KIOSK_STORE: ${{ steps.variant.outputs.store }}
          ORG_GRADLE_PROJECT_KIOSK_UPLOAD_STORE_FILE: ${{ steps.signing.outputs.present == 'true' && format('{0}/upload.jks', runner.temp) || '' }}
          ORG_GRADLE_PROJECT_KIOSK_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_KIOSK_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_KIOSK_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease assembleRelease --no-daemon

      # What the app actually asks the OS for, read out of the merged manifest
      # rather than the source. A dependency can reintroduce a permission
      # without a single line of this repo changing.
      - name: Check the shipped permission surface
        env:
          EXPO_PUBLIC_KIOSK_STORE: ${{ steps.variant.outputs.store }}
        run: npm run check:manifest

      - name: Report what was built
        run: |
          echo "### Build ${{ github.run_number }}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.signing.outputs.present }}" = "true" ]; then
            echo "Signed with the upload key. The .aab can go to Play." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**Signed with the debug key.** Sideload only — Play will reject the .aab." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ls -lh android/app/build/outputs/bundle/release/*.aab \
                 android/app/build/outputs/apk/release/*.apk >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the Play bundle
        uses: actions/upload-artifact@v4
        with:
          name: kiosk-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload the sideload APK
        uses: actions/upload-artifact@v4
        with:
          name: kiosk-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # A run artifact downloads as a .zip, which is awkward to open on a
      # phone. On a tag, attach the APK to a release as well: that gives a
      # plain URL the phone can install straight from. The .aab is deliberately
      # not attached — it is not installable, and publishing it invites
      # somebody to try.
      - name: Attach the APK to a release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv android/app/build/outputs/apk/release/app-release.apk kiosk-clock.apk
          cat > release-notes.md <<'NOTES'
          Open the `.apk` on an Android phone and allow installs from unknown
          sources.

          Everything is unlocked. This build has no store behind it, so there is
          nothing to buy and no watermark. Now playing reads from an endpoint
          you set in settings; reading the device's own media session is not in
          this build.

          Android 7.0 and newer. arm only, so it will not install in a standard
          x86 emulator.
          NOTES
          gh release create "$GITHUB_REF_NAME" kiosk-clock.apk \
            --title "Kiosk $GITHUB_REF_NAME" \
            --notes-file release-notes.md
